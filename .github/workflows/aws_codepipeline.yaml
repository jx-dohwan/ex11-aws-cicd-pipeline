##################################################################################################################

name: Build and Deploy to AWS ASG via CodeDeploy

on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
  CODE_DEPLOY_APP_NAME: ${{ secrets.CODE_DEPLOY_APP_NAME }}
  CODE_DEPLOY_GROUP_NAME: ${{ secrets.CODE_DEPLOY_GROUP_NAME }}
  # ECR 리포지토리 접두사 (계정/네임스페이스)
  ECR_PREFIX: "std04"

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository 
        uses: actions/checkout@v4

      # 1. AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 2. Amazon ECR 로그인
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 3. 멀티 컨테이너 (FastAPI, MySQL, Nginx) 빌드 및 ECR 푸시
      - name: Build and push docker images to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "=== 1. FastAPI 빌드 및 푸시 ==="
          docker build -t $ECR_REGISTRY/$ECR_PREFIX/fastapi:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_PREFIX/fastapi:latest \
                       -f ./build/fastapi/Dockerfile ./build/fastapi
          docker push $ECR_REGISTRY/$ECR_PREFIX/fastapi:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_PREFIX/fastapi:latest

          echo "=== 2. MySQL 빌드 및 푸시 ==="
          docker build -t $ECR_REGISTRY/$ECR_PREFIX/mysql:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_PREFIX/mysql:latest \
                       -f ./build/mysql/Dockerfile ./build/mysql
          docker push $ECR_REGISTRY/$ECR_PREFIX/mysql:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_PREFIX/mysql:latest

          echo "=== 3. Nginx 빌드 및 푸시 ==="
          docker build -t $ECR_REGISTRY/$ECR_PREFIX/nginx:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_PREFIX/nginx:latest \
                       -f ./build/nginx/Dockerfile ./build/nginx
          docker push $ECR_REGISTRY/$ECR_PREFIX/nginx:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_PREFIX/nginx:latest

      # 4. 배포 스크립트 실행 권한 부여
      - name: Grant execute permission for scripts
        run: chmod +x scripts/*.sh

      # 5. CodeDeploy 배포 번들 생성 (compose, scripts, appspec 및 Nginx 설정 포함)
      - name: Create CodeDeploy Bundle
        run: |
          mkdir -p dist
          # EC2에서 docker-compose를 구동할 때 필요한 파일들을 함께 묶습니다.
          zip -r dist/bundle.zip appspec.yml scripts/ compose/ build/nginx/
     
      # 6. 배포 번들 S3 업로드
      - name: Upload bundle to S3
        run: |
          aws s3 cp dist/bundle.zip s3://${{ env.S3_BUCKET_NAME }}/bundle-${{ github.sha }}.zip

      # 7. CodeDeploy 배포 생성
      - name: Trigger CodeDeploy deployment
        run: | 
          aws deploy create-deployment \
            --application-name ${{ env.CODE_DEPLOY_APP_NAME }} \
            --deployment-group-name ${{ env.CODE_DEPLOY_GROUP_NAME }} \
            --s3-location bucket=${{ env.S3_BUCKET_NAME }},key=bundle-${{ github.sha }}.zip,bundleType=zip \
            --region ${{ env.AWS_REGION }}