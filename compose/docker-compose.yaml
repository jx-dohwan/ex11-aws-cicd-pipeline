version: '3.8'

services:
  # 1. 데이터베이스 컨테이너 (MySQL)
  mysql:
    image: 925047940866.dkr.ecr.ap-northeast-2.amazonaws.com/std04/mysql:latest
    container_name: study-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword!
      MYSQL_DATABASE: study          # 소문자로 변경
      MYSQL_USER: std04
      MYSQL_PASSWORD: "1234"
      TZ: Asia/Seoul
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      study-network:
        aliases:
          - mysql

  # 2. 백엔드 API 컨테이너 (FastAPI)
  fastapi:
    image: 925047940866.dkr.ecr.ap-northeast-2.amazonaws.com/std04/fastapi:latest
    container_name: study-fastapi
    restart: always
    depends_on:
      - mysql
    expose:
      - "8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: std04
      DB_PASSWORD: "1234"
      DB_NAME: study              # 소문자로 변경
      TZ: Asia/Seoul
    networks:
      study-network:
        aliases:
          - fastapi
          - study-fastapi

  # 3. 프론트엔드 및 리버스 프록시 컨테이너 (Nginx)
  nginx:
    image: 925047940866.dkr.ecr.ap-northeast-2.amazonaws.com/std04/nginx:latest
    container_name: study-nginx
    restart: always
    depends_on:
      - fastapi
    ports:
      - "80:80"
    volumes:
      - /home/ec2-user/nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/ec2-user/nginx/html:/usr/share/nginx/html:ro
      - /home/ec2-user/nginx/logs:/var/log/nginx
    networks:
      - study-network

volumes:
  mysql_data:

networks:
  study-network:
    driver: bridge