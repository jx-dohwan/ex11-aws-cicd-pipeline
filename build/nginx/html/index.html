<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Masterpiece - Score Management</title>
    <!-- 고전적이고 우아한 세리프 폰트 로드 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <link href="default.css" rel="stylesheet" />
    <script src="https://code.jquery.com/jquery-3.6.1.min.js"></script>
    <script src="default.js"></script>
</head>
<body>
    <div id="container">
        <h1>Container Architecture Masterpiece</h1>
        <div id="loginBox">
            <form id="appendForm">
                <div>
                    <ul class="row cl">
                        <li class="fl uline">
                            <label>아이디</label>
                            <input type="hidden" name="idx" id="idx" value="" />
                        </li>
                        <li class="uline">
                            <select name="uid" id="uid">
                                <option value="">==== 명단에서 선택 ====</option>
                            </select>
                            <input type="button" value="불러오기" id="btnReload" class="art-btn" />
                        </li>
                    </ul>
                </div>
                <div>
                    <ul class="row cl">
                        <li class="fl uline"><label>국어 (Korean)</label></li>
                        <li class="uline"><input type="number" name="kor" id="kor" max="100" min="0" value="0" /></li>
                    </ul>
                </div>
                <div>
                    <ul class="row cl">
                        <li class="fl uline"><label>영어 (English)</label></li>
                        <li class="uline"><input type="number" name="eng" id="eng" max="100" min="0" value="0" /></li>
                    </ul>
                </div>
                <div>
                    <ul class="row cl">
                        <li class="fl uline"><label>수학 (Math)</label></li>
                        <li class="uline"><input type="number" name="mat" id="mat" max="100" min="0" value="0" /></li>
                    </ul>
                </div>
                <div class="action-buttons">
                    <input type="button" value="성적보기" id="btnLoding" class="art-btn" />
                    <input type="button" value="성적 등록" id="btnLogin" class="art-btn primary" />
                    <input type="button" value="성적 수정" id="btnChoEdit" class="art-btn" />
                    <input type="button" value="일괄삭제" id="btnChoDel" class="art-btn danger" />
                </div>
            </form>

            <div class="viewArea">
                <table>
                    <thead>
                        <tr>
                            <th><input type="checkbox" id="allChecked" /></th>
                            <th>아이디</th>
                            <th>이름</th>
                            <th>성별</th>
                            <th>국어</th>
                            <th>영어</th>
                            <th>수학</th>
                            <th>총점</th>
                            <th>평균</th>
                            <th>평가일</th>
                            <th>작업</th>
                        </tr>
                    </thead>
                    <tbody id="resultArea">
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
