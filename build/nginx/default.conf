charset utf-8;

server {
    listen 80;
    server_name _; # ALB를 통해 들어오므로 모든 호스트 허용

    # 클라이언트 실제 IP 및 프로토콜 전달 설정
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto; # ALB가 보낸 프로토콜 전달

    # 1. 프론트엔드 정적 파일
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. FastAPI 백엔드 프록시
    location /api/ {
        # /api/ 를 떼고 FastAPI(fastapi:8000)로 전달합니다.
        # 예) 요청: /api/members -> FastAPI 도달: /members
        proxy_pass http://fastapi:8000/;
        proxy_http_version 1.1;

        # 필수 프록시 헤더 ============================================================
        # 1. 클라이언트가 요청한 원래의 호스트 정보를 백엔드에 전달
        proxy_set_header Host $host;

        # 2. 프록시를 거치기 전, 실제 클라이언트의 IP 주소 전달
        proxy_set_header X-Real-IP $remote_addr;

        # 3. 거쳐간 모든 프록시/ALB의 IP 목록을 누적 전달
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # 4. 클라이언트 프로토콜(http/https) 전달
        proxy_set_header X-Forwarded-Proto $scheme;

        # 5. 연결유지 최적화: 백엔드와의 지속 연결(keep-alive)
        proxy_set_header Connection "";

        # 선택 속성 ======================================================================
        proxy_read_timeout 60s;
    }
}